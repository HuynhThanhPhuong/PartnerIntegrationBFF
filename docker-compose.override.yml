services:
  rabbitmq:
    image: rabbitmq:4.3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"

  partnerverificationapi:
    build:
      context: .
      dockerfile: PartnerVerificationAPI/Dockerfile
    ports:
      - "5131:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development

  api:
    build:
      context: .
      dockerfile: API/Dockerfile
    ports:
      - "5032:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - PartnerVerificationApi__BaseUrl=http://partnerverificationapi:8080
      - RabbitMq__HostName=rabbitmq
      - RabbitMq__Port=5672
      - RabbitMq__UserName=guest
      - RabbitMq__Password=guest
      - Security__ApiKey=super-secret-partner-key-2026
    depends_on:
      - rabbitmq
      - partnerverificationapi